<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工程カレンダー</title>
<style>
:root{
  --bg:#f1f3f2;--off:#e4eae8;--surface:#fff;--ink:#1c2a27;--sub:#66777a;--line:#d9e0de;--accent:#17695e;--accent-ink:#fff;--today:#fff3c4;--sat:#2b6cb0;--sun:#c0392b;--danger:#b3412f;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--off:#223530;--bg:#0f1716;--surface:#18231f;--ink:#e5eeeb;--sub:#8ea3a0;--line:#2b3d39;--accent:#4fc2af;--accent-ink:#06211c;--today:#4a4220;--sat:#7fb4ee;--sun:#ef8b78;--danger:#ef8b78;color-scheme:dark}
}
:root[data-theme="dark"]{--off:#223530;--bg:#0f1716;--surface:#18231f;--ink:#e5eeeb;--sub:#8ea3a0;--line:#2b3d39;--accent:#4fc2af;--accent-ink:#06211c;--today:#4a4220;--sat:#7fb4ee;--sun:#ef8b78;--danger:#ef8b78;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px 8px 48px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.props{display:flex;gap:6px;padding:0 6px 10px;flex-wrap:wrap}
.props select{flex:1;min-width:140px;padding:8px 10px;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.props button,.nav button{padding:6px 12px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
form.pf{display:flex;gap:6px;margin:0 6px 10px}
form.pf input{flex:1;min-width:0}
form.pf button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
form.pf .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.top h1{font-size:1.25rem;margin:0}
.nav{display:flex;gap:6px;align-items:center}
.tabs{display:flex;gap:6px;padding:0 6px 10px}
.tabs button{padding:6px 14px;font-size:.9rem;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px}
.tabs button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wd{background:var(--surface);text-align:center;font-size:.75rem;padding:4px 0;color:var(--sub)}
.wd.sa,.d.sa .n{color:var(--sat)}.wd.su,.d.su .n{color:var(--sun)}
.d{background:var(--surface);min-height:132px;padding:2px;border:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.d.out{opacity:.4}.d.off{background:var(--off)}.d.hand{background:#ffe6c7;color:#1c2a27}.d.hand .n{color:#1c2a27}.d.hol .n{color:var(--sun)}.d.today{background:var(--today)}.d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.n{font-size:.72rem;padding-left:2px}
.chip{font-size:.62rem;line-height:1.25;padding:1px 3px;border-radius:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.6rem;color:var(--sub);padding-left:2px}
.tabs .pdfb{margin-left:auto}
.gwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.gin{display:block}
.grow{display:flex;border-bottom:1px solid var(--line)}
.gname{position:sticky;left:0;z-index:2;flex:none;width:84px;padding:6px 8px;font-size:.8rem;font-weight:600;background:var(--surface);border-right:1px solid var(--line);overflow-wrap:anywhere}
.gdays{display:flex}
.gdays span{flex:none;width:26px;text-align:center;font-size:.65rem;color:var(--sub);padding:5px 0}
.gdays .su{color:var(--sun)}.gdays .sa{color:var(--sat)}.gdays .hol{color:var(--sun)}.gdays .off{background:var(--off)}.gdays .today{background:var(--today)}
.garea{position:relative;flex:none;background-image:repeating-linear-gradient(to right,transparent 0,transparent 25px,var(--line) 25px,var(--line) 26px)}
.goff{position:absolute;top:0;bottom:0;width:26px;background:var(--off)}
.gtoday{position:absolute;top:0;bottom:0;width:26px;background:var(--today);opacity:.7}
.gbar{position:absolute;height:20px;padding:0;border:0;border-radius:6px}
.glab{position:absolute;height:16px;padding:0;border:0;background:none;font-size:.72rem;line-height:16px;text-align:left;white-space:nowrap;color:var(--ink)}
.panel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.panel h2{font-size:1rem;margin:0 0 8px}
.item{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.bar{width:6px;border-radius:3px;flex:none}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;overflow-wrap:anywhere}
.item .meta{font-size:.82rem;color:var(--sub)}
.item .note{font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere}
.act{display:flex;flex-direction:column;gap:4px}
.act button{padding:2px 8px;font-size:.8rem;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:6px}
.act .del:hover{color:var(--danger)}
.empty{color:var(--sub);font-size:.9rem;margin:0}
.primary{margin-top:10px;width:100%;padding:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:10px}
form{display:grid;gap:8px;margin-top:10px}
form label{display:grid;gap:2px;font-size:.8rem;color:var(--sub)}
form input,form select,form textarea{padding:9px 10px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{display:block}
.colors input{position:absolute;opacity:0;width:0;height:0}
.colors span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.colors input:checked+span{border-color:var(--ink)}
.colors input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btns .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.status{font-size:.75rem;color:var(--sub);text-align:center;margin-top:10px}
#offPanel{margin:0 6px 10px}
.wds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.wds label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.chk{display:flex;align-items:center;gap:6px;margin:8px 0}
#offDate{padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%}
#offAdd{padding:9px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.offrow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.offrow button{padding:2px 8px;font-size:.8rem;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:6px}
#infoPanel,#pdfPanel{margin:0 6px 10px}
.offrow .mv{display:flex;gap:6px}
.offrow .mv button{min-width:40px;padding:4px 10px;font-size:.95rem}
.offrow button:disabled{opacity:.3;cursor:default}
.fld{display:grid;gap:2px;font-size:.8rem;color:var(--sub);margin-top:8px}
.fld input{padding:9px 10px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%}
.fld select{padding:9px 10px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%}
.addr{padding:0 6px 10px;font-size:.88rem;overflow-wrap:anywhere}
.addr a{color:var(--accent);margin-left:8px;font-weight:600}
.chip.hand{background:#d9780a}
.chip.meet{background:var(--surface);color:var(--ink);border:1px dashed var(--sub)}
.ghand{position:absolute;top:0;bottom:0;width:26px;background:rgba(255,150,40,.3)}
.gdays .hand{background:#ffe6c7;color:#1c2a27}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 6px 8px;font-size:.78rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.sync{display:block;margin:8px auto 0;padding:8px 14px;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px}
[hidden]{display:none!important}
#auth{max-width:420px;margin:0 auto;padding:40px 16px}
#auth .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
#auth h1{font-size:1.3rem;margin:0 0 8px}
#auth button{width:100%;margin-top:10px}
#auth .sync{margin-top:8px}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;font-size:.8rem;color:var(--sub);border-bottom:1px solid var(--line);background:var(--surface)}
#topbar .tb{display:flex;gap:6px}
#topbar button{padding:4px 10px;font-size:.8rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px}
#adminPanel{max-width:640px;margin:0 auto;padding:16px 12px 48px}
.urow{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.urow select,.urow input{padding:8px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;width:100%}
.urow button{padding:8px;color:var(--accent-ink);background:var(--accent);border:0;border-radius:8px;font-weight:600}
</style>
</head>
<body>
<div id="auth">
  <div class="card">
    <h1>工程カレンダー</h1>
    <div id="viewLogin">
      <label class="fld">メールアドレス<input id="em" type="email" autocomplete="username"></label>
      <label class="fld">パスワード(6文字以上)<input id="pw" type="password" autocomplete="current-password"></label>
      <button type="button" id="btnLogin" class="primary">ログイン</button>
      <button type="button" id="btnReg" class="sync">新規登録</button>
      <p id="authMsg" class="status"></p>
    </div>
    <div id="viewPending" hidden>
      <p id="pendMsg"></p>
      <button type="button" id="btnRecheck" class="primary">もう一度確認</button>
      <button type="button" id="btnOut2" class="sync">ログアウト</button>
    </div>
    <div id="viewVerify" hidden>
      <p>管理者のメールアドレスは、確認が必要です。届いた確認メールのリンクを開いてから、下のボタンを押してください(迷惑メールフォルダも確認してください)。</p>
      <button type="button" id="btnVerified" class="primary">確認した</button>
      <button type="button" id="btnResend" class="sync">確認メールを再送</button>
      <button type="button" id="btnOut3" class="sync">ログアウト</button>
      <p id="verMsg" class="status"></p>
    </div>
  </div>
</div>
<div id="topbar" hidden>
  <span id="who"></span>
  <span class="tb"><button type="button" id="btnUsers" hidden>ユーザー管理</button><button type="button" id="btnOut">ログアウト</button></span>
</div>
<section id="adminPanel" hidden>
  <h2>ユーザー管理</h2>
  <p class="empty">新しく登録した人は「承認待ち」です。役割を選んで保存すると、使えるようになります。「業者」は、工事の担当と同じ名前を入れると、その担当の工事だけ見られます。</p>
  <div id="userList"></div>
</section>
<main id="appMain" hidden>
  <div class="props">
    <select id="prop" aria-label="物件"></select>
    <button type="button" id="propAdd">＋物件</button>
    <button type="button" id="offBtn" hidden>休日設定</button>
    <button type="button" id="infoBtn" hidden>物件情報</button>
    <button type="button" id="propDel" hidden>物件を削除</button>
  </div>
  <form class="pf" id="propForm" hidden>
    <input id="pName" required maxlength="40" placeholder="物件名 例:山田邸新築" aria-label="物件名">
    <button type="submit" class="ok">追加</button>
    <button type="button" id="pCancel">戻る</button>
  </form>
  <div class="addr" id="addrLine" hidden></div>
  <section class="panel" id="infoPanel" hidden>
    <h2>物件情報</h2>
    <label class="fld">物件名<input id="iName" maxlength="40"></label>
    <label class="fld">郵便番号(7桁を入れると、住所が入ります)<input id="iZip" maxlength="8" inputmode="numeric" placeholder="例:123-4567"></label>
    <label class="fld">住所<input id="iAddr" maxlength="100" placeholder="例:東京都○○区1-2-3"></label>
    <label class="fld">GoogleマップのURL(空欄なら住所から自動で作ります)<input id="iMap" type="url" maxlength="300" placeholder="https://maps.app.goo.gl/..."></label>
    <label class="fld">工事の種類<select id="iKind"><option value="">未選択</option><option value="new">新築</option><option value="reform">リフォーム</option></select></label>
    <label class="fld">着工日<input id="iStart" type="date"></label>
    <label class="fld">引き渡し予定日<input id="iHand" type="date"></label>
    <div class="fld">物件の色(全物件表示で使います)</div>
    <div class="colors" id="pcolors" role="radiogroup" aria-label="物件の色"></div>
    <div class="fld">工事種別の順番(横棒の工程表の並び順)</div>
    <div id="typeOrder"></div>
    <button type="button" class="primary" id="infoClose">閉じる</button>
  </section>
  <section class="panel" id="offPanel" hidden>
    <h2>休日設定(この物件)</h2>
    <div class="wds" id="offWd" role="group" aria-label="休みの曜日"></div>
    <label class="chk"><input type="checkbox" id="offHol"> 祝日を休みにする</label>
    <div class="row2"><input type="date" id="offDate" aria-label="休工日"><button type="button" id="offAdd">休工日を追加</button></div>
    <div id="offList"></div>
    <button type="button" class="primary" id="offClose">閉じる</button>
  </section>
  <p class="empty" id="noProp" style="padding:16px 6px" hidden></p>
  <div id="body">
    <div class="top">
      <h1 id="title"></h1>
      <div class="nav">
        <button type="button" id="prev" aria-label="前の月">‹</button>
        <button type="button" id="now">今日</button>
        <button type="button" id="next" aria-label="次の月">›</button>
      </div>
    </div>
    <div class="tabs" role="group" aria-label="表示の切り替え">
      <button type="button" id="tabCal" aria-pressed="true">カレンダー</button>
      <button type="button" id="tabGantt" aria-pressed="false">工程表(横棒)</button>
      <button type="button" id="pdfBtn" class="pdfb" hidden>PDFで保存</button>
    </div>
    <div class="legend" id="legend" hidden></div>
    <section class="panel" id="pdfPanel" hidden>
      <h2>PDFの範囲</h2>
      <div class="row2"><label class="fld">開始日<input id="pdFrom" type="date"></label><label class="fld">終了日<input id="pdTo" type="date"></label></div>
      <button type="button" class="primary" id="pdfGo">この範囲でPDFを保存</button>
      <button type="button" class="sync" id="pdfCancel">閉じる</button>
    </section>
    <div class="grid" id="grid"></div>
    <div class="gwrap" id="gantt" hidden></div>
    <section class="panel">
      <h2 id="dayTitle"></h2>
      <div id="dayList"></div>
      <button type="button" class="primary" id="addBtn">この日に工事を追加</button>
      <form id="form" hidden>
        <label>種類<select id="fKind"><option value="work">工事</option><option value="meeting">打ち合わせ(横棒の工程表には出しません)</option></select></label>
        <label>工事種別<select id="fType"></select></label>
        <input id="fTypeNew" maxlength="30" placeholder="新しい工事種別 例:大工工事" aria-label="新しい工事種別" hidden>
        <label>何工事か(工事名)<input id="fName" required maxlength="40" placeholder="例:土台敷き"></label>
        <label>担当(業者)<select id="fWhoSel"></select></label>
        <input id="fWhoNew" maxlength="40" placeholder="新しい業者名 例:山田組" aria-label="新しい業者名" hidden>
        <div class="row2">
          <label>開始日<input id="fStart" type="date" required></label>
          <label>終了日<input id="fEnd" type="date" required></label>
        </div>
        <label class="chk"><input type="checkbox" id="fAll" checked style="width:auto"> 終日</label>
        <div class="row2" id="fTimes" hidden><label>開始時刻<input id="fT1" type="time" value="08:00"></label><label>終了時刻<input id="fT2" type="time" value="17:00"></label></div>
        <label class="chk"><input type="checkbox" id="fSkip" style="width:auto"> 休日は作業しない(休日を飛ばす)</label>
        <div class="colors" id="colors" role="radiogroup" aria-label="色" hidden></div>
        <label>メモ<textarea id="fNote" rows="2" maxlength="200"></textarea></label>
        <div class="btns"><button type="button" id="cancel">キャンセル</button><button type="submit" class="ok">保存</button></div>
      </form>
    </section>
  </div>
  <p class="status" id="status"></p>
  <p class="status" id="gstatus"></p>
  <button type="button" class="sync" id="syncAll" hidden>Googleカレンダーに登録・更新</button>
</main>
<script id="appjs" type="text/plain">
const COLORS=["#1d7a6c","#2b6cb0","#b7791f","#c05621","#97266d","#5a67d8"];
const LEG="_none",ALL="__all",GC="Google Calendar",W=26;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dn=s=>parseInt(s.slice(8),10);
const WD=["日","月","火","水","木","金","土"];
const ld=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")||[]}catch(e){return[]}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let props=ld("koutei-props"),tasks=ld("koutei-local"),cur="",view=new Date(),sel=ymd(new Date()),editId=null,propsRef=null,tasksRef=null,canWrite=true,mcp=null,syncOn=false,mode="cal";
view.setDate(1);

const propList=()=>{const l=props.slice();if(tasks.some(t=>!t.propId))l.push({id:LEG,name:"物件未設定",types:[]});return l};
const curTasks=()=>cur===ALL?tasks.slice():tasks.filter(t=>(t.propId||LEG)===cur);
const curProp=()=>propList().find(p=>p.id===cur);
function ensureCur(){const l=propList();if(cur!==ALL&&!l.find(p=>p.id===cur))cur=l.length?l[0].id:""}
function typesOf(){
  const p=curProp(),a=p&&p.types?p.types.slice():[];
  curTasks().forEach(t=>{if(t.kind==="meeting")return;const x=t.type||"その他";if(!a.includes(x))a.push(x)});
  return a;
}
// ---- 祝日・休日 ----
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const h={},add=(mo,d,n)=>{h[y+"-"+pad(mo)+"-"+pad(d)]=n};
  const nth=(mo,k,wd)=>1+((wd-new Date(y,mo-1,1).getDay()+7)%7)+(k-1)*7;
  add(1,1,"元日");add(1,nth(1,2,1),"成人の日");add(2,11,"建国記念の日");
  if(y>=2020)add(2,23,"天皇誕生日");
  add(3,Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4)),"春分の日");
  add(4,29,"昭和の日");add(5,3,"憲法記念日");add(5,4,"みどりの日");add(5,5,"こどもの日");
  add(7,nth(7,3,1),"海の日");add(8,11,"山の日");add(9,nth(9,3,1),"敬老の日");
  add(9,Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4)),"秋分の日");
  add(10,nth(10,2,1),"スポーツの日");add(11,3,"文化の日");add(11,23,"勤労感謝の日");
  Object.keys(h).forEach(k=>{
    const d=new Date(k+"T00:00:00");
    if(d.getDay()===0){const e=new Date(d);do{e.setDate(e.getDate()+1)}while(h[ymd(e)]);h[ymd(e)]="振替休日"}
  });
  for(let i=1;i<=365;i++){
    const d=new Date(y,0,i),pv=new Date(y,0,i-1),nx=new Date(y,0,i+1),k=ymd(d);
    if(d.getFullYear()===y&&!h[k]&&d.getDay()!==0&&h[ymd(pv)]&&h[ymd(nx)])h[k]="国民の休日";
  }
  return holCache[y]=h;
}
const holName=k=>holidays(+k.slice(0,4))[k]||"";
function getOff(p){const o=(p&&p.off)||{};return {wd:o.wd||[0],hol:o.hol!==false,dates:o.dates||[]}}
function isOff(k,p){
  const o=getOff(p),wd=new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8)).getDay();
  return o.wd.includes(wd)||(o.hol&&!!holName(k))||o.dates.includes(k);
}
const propOf=t=>props.find(p=>p.id===t.propId);
const pcol=p=>p.color||COLORS[Math.max(props.findIndex(x=>x.id===p.id),0)%COLORS.length];
const VC=["#1d7a6c","#2b6cb0","#c05621","#97266d","#5a67d8","#b7791f","#2f855a","#c53030","#6b46c1","#0987a0","#8a6d3b","#d53f8c"];
const vcol=n=>{if(!n)return "#718096";let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return VC[h%VC.length]};
const tcol=t=>{const p=propOf(t);return cur===ALL&&p?pcol(p):vcol(t.who)};
const handsOn=k=>(cur===ALL?props:[curProp()]).filter(p=>p&&p.handover===k);
const mapLink=p=>{const u=(p&&p.mapUrl)||"";if(/^https?:\/\//i.test(u))return u;return p&&p.addr?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.addr):""};
const segs=(t,p)=>{
  if(!t.skipOff)return [[t.start,t.end]];
  const out=[];let s=null,pv=null,k=t.start;
  while(k<=t.end){if(isOff(k,p)){if(s){out.push([s,pv]);s=null}}else{if(!s)s=k;pv=k}k=dayAfter(k)}
  if(s)out.push([s,pv]);

};
const onDay=(t,k)=>t.start<=k&&k<=t.end&&!(t.skipOff&&isOff(k,propOf(t)));

function twoStep(btn,fn){

// ---- Googleカレンダー ----
function dayAfter(s){const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+1))}
async function gDelete(ids){for(const eid of String(ids).split(",").filter(Boolean)){try{await mcp.callTool(GC,"delete_event",{eventId:eid,notificationLevel:"NONE"})}catch(e){if(!e||e.code!=="tool_error")throw e}}}
async function gCreate(t){
  const p=propOf(t),ml=mapLink(p);
  const title=t.name+"("+(t.type||"その他")+")"+(p?"【"+p.name+"】":"")+(t.who?" "+t.who:"");
  const desc=[p&&p.addr?"住所:"+p.addr:"",ml?"地図:"+ml:"",t.who?"担当:"+t.who:"",t.note||""].filter(Boolean).join("\n");
  const timed=t.allDay===false&&t.t1&&t.t2,ids=[];
  try{
    for(const [a,b] of segs(t,p)){
      const args=timed?{startTime:a+"T"+t.t1+":00",endTime:b+"T"+t.t2+":00",allDay:false}:{startTime:a+"T00:00:00",endTime:dayAfter(b)+"T00:00:00",allDay:true};
      const r=await mcp.callTool(GC,"create_event",{summary:title,description:desc,notificationLevel:"NONE",...args});
      const q=r&&(r.structuredContent||r.payload);
      if(q&&q.id)ids.push(q.id);
    }
  }catch(e){
    if(ids.length){try{await gDelete(ids.join(","))}catch(x){}}
    throw e;
  }
  return ids.join(",");
}
function gErr(e){
  switch(e&&e.code){
    case "needs_reauth":return "Googleカレンダーの接続が切れています。claude.aiの設定のコネクタで再接続してください";
    case "server_not_connected":return "Googleカレンダーが接続されていません。claude.aiの設定のコネクタで追加してください";
    case "approval_required":case "not_in_manifest":return "Googleカレンダーへの書き込みが許可されていません";
    case "server_unavailable":case "upstream_error":return "Googleカレンダーへの登録結果を確認できませんでした。カレンダーを見て確認してください";
    case "tool_error":return "Googleカレンダーが登録を受け付けませんでした";
    default:return "Googleカレンダーに反映できませんでした";
  }
}

  else{const i=props.findIndex(x=>x.id===id);if(i>=0)props[i]=p;else props.push(p);sv("koutei-props",props);render()}
}
async function deleteProp(id){
  props=props.filter(p=>p.id!==id);

  else sv("koutei-props",props);

}
async function saveTask(t,prev){
  let gid=prev?prev.gEventId||"":"";
  if(syncOn){
    try{
      if(gid){try{await gDelete(gid)}catch(e){if(!e||e.code!=="tool_error")throw e}gid=""}
      gid=await gCreate(t);
      gMsg(gid?"Googleカレンダーにも反映しました":"Googleカレンダーへの登録を確認できませんでした");
    }catch(e){gMsg(gErr(e))}
  }
  t.gEventId=gid;if(gid)t.gv=2;
  const {id,...body}=t;
  {const pp=propOf(t);body.propName=pp?pp.name:"";body.propAddr=pp&&pp.addr?pp.addr:"";body.propMap=pp&&pp.mapUrl?pp.mapUrl:""}
  if(tasksRef){try{await tasksRef.doc(id).set(body)}catch(e){$("status").textContent="保存できませんでした。編集権限を確認してください"}}
  else{const i=tasks.findIndex(x=>x.id===id);if(i>=0)tasks[i]=t;else tasks.push(t);sv("koutei-local",tasks);render()}
}
async function removeTask(id){
  const old=tasks.find(x=>x.id===id);
  if(syncOn&&old&&old.gEventId){try{await gDelete(old.gEventId);gMsg("Googleカレンダーからも削除しました")}catch(e){if(!e||e.code!=="tool_error")gMsg(gErr(e))}}
  if(tasksRef){try{await tasksRef.doc(id).delete()}catch(e){$("status").textContent="削除できませんでした"}}
  else{tasks=tasks.filter(x=>x.id!==id);sv("koutei-local",tasks);render()}
}

function buildPdfCanvas(from,to){
  const p=curProp(),days=[];
  for(let k=from;k<=to;k=dayAfter(k))days.push(k);
  const n=days.length,T0=Date.parse(from),di=s=>Math.round((Date.parse(s)-T0)/864e5);
  const LW=170,PAD=24,dw=Math.max(22,Math.min(46,Math.floor((1684-LW-PAD*2)/n)));
  const CW=Math.max(1684,LW+PAD*2+n*dw),X0=PAD+LW,XE=X0+n*dw;
  const mc=document.createElement("canvas").getContext("2d");mc.font="18px "+FONT;
  const byStart=(a,b)=>a.start<b.start?-1:a.start>b.start?1:0;
  const rows=typesOf().map(ty=>{
    const items=curTasks().filter(t=>(t.type||"その他")===ty&&t.start<=to&&t.end>=from).sort(byStart);
    const lanes=[],pl=[];
    items.forEach(t=>{
      const sg=segs(t,propOf(t)).map(a=>[a[0]<from?from:a[0],a[1]>to?to:a[1]]).filter(a=>a[0]<=a[1]);
      if(!sg.length)return;
      const left=di(sg[0][0])*dw,right=(di(sg[sg.length-1][1])+1)*dw,end=Math.max(right,left+mc.measureText(t.name).width+10);
      let i=lanes.findIndex(v=>v<=left);if(i<0){i=lanes.length;lanes.push(0)}
      lanes[i]=end;pl.push({t,i,left,sg});
    });
    return {ty,pl,h:Math.max(lanes.length,1)*54+10};
  });
  const list=curTasks().filter(t=>t.kind!=="meeting"&&t.start<=to&&t.end>=from).sort(byStart);
  const top=122,cs=top+58,chartH=cs+rows.reduce((a,r)=>a+r.h,0);
  const H=Math.max(Math.round(CW*0.707),chartH+(list.length?100+list.length*30:50));
  const c=document.createElement("canvas");c.width=CW;c.height=H;
  const x=c.getContext("2d");x.textBaseline="top";
  x.fillStyle="#fff";x.fillRect(0,0,CW,H);
  x.fillStyle="#111";x.font="bold 34px "+FONT;x.fillText((p?p.name:"")+"  工程表",PAD,22);
  x.fillStyle="#555";x.font="22px "+FONT;x.fillText(from.replace(/-/g,"/")+" 〜 "+to.replace(/-/g,"/"),PAD,66);
  const info=[p&&p.addr?"住所:"+p.addr:"",p&&p.handover?"引き渡し日:"+p.handover.replace(/-/g,"/"):""].filter(Boolean).join("     ");
  if(info){x.fillStyle="#333";x.font="20px "+FONT;x.fillText(info,PAD,94)}
  days.forEach((k,idx)=>{
    const wd=new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8)).getDay(),dx=X0+idx*dw,hol=holName(k);
    if(isOff(k,p)){x.fillStyle="#ececec";x.fillRect(dx,top+24,dw,chartH-top-24)}
    if(idx===0||k.slice(8)==="01"){x.fillStyle="#333";x.font="bold 18px "+FONT;x.textAlign="left";x.fillText(+k.slice(0,4)+"年"+(+k.slice(5,7))+"月",dx+2,top+2)}
    x.fillStyle=(wd===0||hol)?"#c0392b":wd===6?"#2b6cb0":"#333";x.font="16px "+FONT;x.textAlign="center";
    x.fillText(String(+k.slice(8)),dx+dw/2,top+32);
  });
  x.textAlign="left";
  x.strokeStyle="#d9d9d9";x.lineWidth=1;
  for(let d=0;d<=n;d++){x.beginPath();x.moveTo(X0+d*dw+.5,top+24);x.lineTo(X0+d*dw+.5,chartH);x.stroke()}
  x.strokeStyle="#888";x.beginPath();x.moveTo(PAD,cs+.5);x.lineTo(XE,cs+.5);x.stroke();
  let yy=cs;
  rows.forEach(r=>{
    x.strokeStyle="#888";x.beginPath();x.moveTo(PAD,yy+.5);x.lineTo(XE,yy+.5);x.stroke();
    x.fillStyle="#111";x.font="bold 20px "+FONT;x.fillText(r.ty,PAD+4,yy+8,LW-12);
    r.pl.forEach(({t,i,left,sg})=>{
      x.fillStyle="#111";x.font="18px "+FONT;x.fillText(t.name,X0+left+3,yy+4+i*54);
      x.fillStyle=vcol(t.who);
      sg.forEach(([a,b])=>x.fillRect(X0+di(a)*dw+1,yy+4+i*54+26,(di(b)-di(a)+1)*dw-2,20));
    });
    yy+=r.h;
  });
  x.strokeStyle="#888";x.beginPath();x.moveTo(PAD,yy+.5);x.lineTo(XE,yy+.5);x.stroke();
  if(p&&p.handover&&p.handover>=from&&p.handover<=to){
    const hx=X0+di(p.handover)*dw+dw/2;
    x.fillStyle="rgba(255,150,40,0.30)";x.fillRect(hx-dw/2,top+24,dw,chartH-top-24);
    x.fillStyle="#c05a00";x.font="bold 18px "+FONT;x.textAlign="center";x.fillText("引き渡し予定",Math.min(Math.max(hx,PAD+40),CW-60),chartH+4);x.textAlign="left";
  }
  if(list.length){
    let ly=chartH+40;
    x.fillStyle="#111";x.font="bold 22px "+FONT;x.fillText("工事一覧",PAD,ly);ly+=40;
    x.font="19px "+FONT;

      x.fillStyle=vcol(t.who);x.fillRect(PAD,ly+4,10,18);

      ly+=30;
    });
  }
  return c;
}
function makePdf(jpeg,w,h){
  const pw=842,ph=Math.round(pw*h/w*100)/100;
  const te=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=b=>{const u=typeof b==="string"?te.encode(b):b;parts.push(u);len+=u.length};
  const obj=(k,body)=>{offs[k]=len;push(k+" 0 obj\n");body.forEach(b=>push(b));push("\nendobj\n")};
  push("%PDF-1.4\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
  obj(3,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Contents 4 0 R /Resources << /XObject << /Im0 5 0 R >> >> >>"]);
  const cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
  obj(4,["<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"]);
  obj(5,["<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n",jpeg,"\nendstream"]);
  const xr=len;
  let t="xref\n0 6\n0000000000 65535 f \n";
  for(let k=1;k<=5;k++)t+=String(offs[k]).padStart(10,"0")+" 00000 n \n";
  push(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF\n");
  return new Blob(parts,{type:"application/pdf"});
}

      return onSnapshot(name==="tasks"?tq():collection(fs,name),s=>next(wrap(s)),err);
    },
    doc:id=>({
      set:b=>setDoc(doc(fs,name,id),JSON.parse(JSON.stringify(b))),
      delete:()=>deleteDoc(doc(fs,name,id))
    })
  })};
  const userShim={can:async()=>staff,isOwner:async()=>role==="admin",canEdit:async()=>role==="admin"};
  const dlShim={save:async({filename,data})=>{
    const url=URL.createObjectURL(data),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),15000);
  }};
  window.claude={use:async n=>n==="db"?dbShim:n==="user"?userShim:n==="downloads"?dlShim:null};
  g("auth").hidden=true;g("topbar").hidden=false;g("appMain").hidden=false;
  g("who").textContent=u.email+(role==="admin"?"(管理者)":role==="vendor"?"(業者:"+vendorName+")":"");
  if(role==="admin"){
    g("btnUsers").hidden=false;
    let unsub=null;
    g("btnUsers").onclick=()=>{
      const p=g("adminPanel");p.hidden=!p.hidden;g("appMain").hidden=!p.hidden;
      if(!p.hidden&&!unsub)unsub=onSnapshot(collection(fs,"users"),s=>renderUsers(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{g("userList").textContent="読み込めませんでした"});
    };
  }
  const sc=document.createElement("script");
  sc.textContent=g("appjs").textContent;
  document.body.appendChild(sc);
}
function renderUsers(us){
  const box=g("userList");box.innerHTML="";
  us.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(u=>{
    const r=document.createElement("div");r.className="urow";
    const t=document.createElement("div");t.textContent=u.email||u.id;
    const sel=document.createElement("select");
    [["pending","承認待ち"],["member","社内メンバー"],["vendor","業者"],["blocked","停止"]].forEach(([v,l])=>{const o=document.createElement("option");o.value=v;o.textContent=l;sel.appendChild(o)});
    sel.value=u.role||"pending";
    const vn=document.createElement("input");vn.placeholder="業者名(工事の担当と同じ名前)";vn.value=u.vendorName||"";
    const b=document.createElement("button");b.type="button";b.textContent="保存";
    b.onclick=async()=>{
      try{await updateDoc(doc(fs,"users",u.id),{role:sel.value,vendorName:sel.value==="vendor"?vn.value.trim():""});b.textContent="保存しました"}
      catch(e){b.textContent="保存できませんでした"}
    };
    r.append(t,sel,vn,b);box.appendChild(r);
  });
}
</script>
</body>
</html>
